<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commerce Club · Демонстрация</title><link rel="stylesheet" href="presentation.css"></head>
<body><main class="stage"><aside class="controls"><div class="identity"><span>VK</span> Commerce Club</div>
<h1>Уровни магазина</h1><p class="intro">Сравните привилегии продавца или пройдите путь от клипа до заказа в своём демомагазине.</p>
<div class="panel"><label for="level-control">Режим показа</label><output id="mode" for="level-control">Мой магазин</output>
<input id="level-control" type="range" min="0" max="3" step="1" value="0" aria-valuetext="Мой магазин">
<div class="stops" aria-label="Выбрать режим"><button data-step="0">Мой магазин</button><button data-step="1">Start</button><button data-step="2">Growth</button><button data-step="3">Pro</button></div>
<p id="explain" aria-live="polite">Здесь сохраняются ваши заказы и оформление.</p></div></aside>
<div class="device"><iframe id="phone" title="Интерактивный магазин VK" allow="fullscreen"></iframe></div></main><script type="module" src="presentation.js"></script></body></html>
