<!doctype html>
<html lang="ru"><head><base href="./releases/10fbc9dd67f4b79fa634954928e82f3b65fb4174/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commerce Club · Интерактивное демо</title><link rel="stylesheet" href="presentation.css"></head>
<body><header class="top"><div class="identity"><b>VK</b> Commerce Club</div>
<div class="shop-picker"><strong>Магазины</strong><div class="sellers" role="group" aria-label="Выбор продавца"><button data-shop="beauty" aria-pressed="true"><img width="30" height="30" src="studio/media/beauty-scene.webp" alt="">Тон</button><button data-shop="home" aria-pressed="false"><img width="30" height="30" src="studio/media/home-scene.webp" alt="">Тихий дом</button></div></div></header>
<main class="stage"><section class="profile"><div class="profile-photo"><img id="scene" alt=""><div><small id="category"></small><h1 id="shop-name"></h1></div></div>
<div class="profile-info"><h2>Открыть на телефоне</h2><div class="routes"><button data-path="cabinet.html" data-hash="club"><span class="route-icon" aria-hidden="true">▤</span><span>Кабинет продавца</span></button><button data-path="cabinet.html" data-hash="orders"><span class="route-icon" aria-hidden="true">≡</span><span>Заказы</span></button><button data-path="studio/" data-hash="edit"><span class="route-icon" aria-hidden="true">✦</span><span>Студия оформления</span></button><button data-path="cabinet.html" data-hash="partner"><span class="route-icon" aria-hidden="true">◇</span><span>Brand Partners</span></button><button id="buyer-path" data-path="studio/" data-hash="store"><span class="route-icon" aria-hidden="true">◉</span><span>Сообщество глазами покупателя</span></button></div><p id="ready-note" hidden>Для открытия сообщества подтвердите остаток в студии.</p></div></section>
<div class="device"><div class="glass"><div class="status" aria-hidden="true"><span>9:41</span><i></i><span class="battery"></span></div><section id="login" class="login"><div class="login-content"><img id="login-photo" alt=""><p>Commerce Club</p><h2>Вход в кабинет</h2><p>Демонстрационный профиль продавца</p><button id="enter"></button></div></section><iframe hidden id="phone" title="Интерактивный магазин VK" allow="fullscreen"></iframe><div class="chin" aria-hidden="true"><i></i></div></div></div>
<aside class="panel"><div class="panel-heading"><h2>Уровень продавца</h2><output id="mode" for="level-control"></output></div>
<input id="level-control" aria-label="Пример уровня продавца" type="range" min="0" max="2" step="1" value="0">
<div class="stops" role="group" aria-label="Пример уровня"><button data-step="0">Start</button><button data-step="1">Growth</button><button data-step="2">Pro</button></div>
<p id="explain"></p><div class="live"><h2>Сейчас в магазине</h2><dl><div><dt>Экран</dt><dd id="screen">Вход</dd></div><div><dt>Выполнено заказов</dt><dd id="count"></dd></div><div><dt>Рекламный кредит</dt><dd id="credit-state"></dd></div></dl></div></aside></main><script type="module" src="presentation.js"></script></body></html>
