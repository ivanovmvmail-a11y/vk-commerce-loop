<!doctype html>
<html lang="ru"><head><base href="./releases/e19059b3f07329af7d9ea71b241a99f8d11e6a4f/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commerce Club · Интерактивное демо</title><link rel="stylesheet" href="presentation.css"></head>
<body><header class="top"><div class="identity"><b>VK</b> Commerce Club</div>
<div class="sellers" role="group" aria-label="Выбор продавца"><button data-shop="beauty" aria-pressed="true"><img width="30" height="30" src="studio/media/beauty-scene.webp" alt="">Тон</button><button data-shop="home" aria-pressed="false"><img width="30" height="30" src="studio/media/home-scene.webp" alt="">Тихий дом</button></div></header>
<main class="stage"><section class="profile"><div class="profile-photo"><img id="scene" alt=""><div><small id="category"></small><h1 id="shop-name"></h1></div></div>
<div class="profile-info"><h2>Открыть на телефоне</h2><div class="routes"><button data-path="cabinet.html" data-hash="club"><span class="route-icon" aria-hidden="true">▤</span><span>Кабинет продавца</span></button><button data-path="studio/" data-hash="edit"><span class="route-icon" aria-hidden="true">✦</span><span>Shop Studio</span></button><button id="buyer-path" data-path="studio/" data-hash="store"><span class="route-icon" aria-hidden="true">◉</span><span>Сообщество глазами покупателя</span></button></div><p id="ready-note" hidden>Для открытия сообщества подтвердите готовность каталога.</p></div></section>
<div class="device"><div class="glass"><div class="status" aria-hidden="true"><span>9:41</span><i></i><span class="battery"></span></div><iframe id="phone" title="Интерактивный магазин VK" allow="fullscreen"></iframe><div class="chin" aria-hidden="true"><i></i></div></div></div>
<aside class="panel"><div class="panel-heading"><h2 id="mode-title">Уровень продавца</h2><output id="mode" for="level-control"></output></div>
<input id="level-control" aria-label="Пример уровня продавца" type="range" min="0" max="3" step="1" value="0">
<div class="stops" role="group" aria-label="Пример уровня"><button data-step="0">Мой магазин</button><button data-step="1">Start</button><button data-step="2">Growth</button><button data-step="3">Pro</button></div>
<p id="explain"></p><div class="live"><h2>Сейчас в магазине</h2><dl><div><dt>Экран</dt><dd id="screen">Обзор клуба</dd></div><div><dt id="metric-label">Текущий уровень</dt><dd id="count"></dd></div><div><dt id="reward-label">Рекламный кредит</dt><dd id="credit-state"></dd></div></dl></div></aside></main><script type="module" src="presentation.js"></script></body></html>
